# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: "Write-Execute computation: a Lean formalization of Self-Spectre with errata"
  description: >-
    Formalizes Gregory Morse's 2019 paper "Self-Spectre, Write-Execute and the Hidden State":
    the Write-Execute half unconditionally, the Self-Spectre half as conditional theorems over an
    abstract speculation contract. An ideal word-level machine whose only
    operations are a store and a jump, with no data reads, simulates finite Turing
    machines step for step, preserving halting, divergence and the tape; a finite
    image is exact until its guard faults. The development proves the jump-table
    lookup, the 8-bit tables, wide ADD, SUB, SHL, SHR, XOR, 32x32 multiplication,
    64/32 division, two-step modular reduction, modular exponentiation with its
    multiplication count, the AES-128 T-table cipher and the Write-Execute AES
    procedure against FIPS-197. The Self-Spectre half is proved as a conditional result under an abstract
    speculation contract (a branch predictor and a speculation window as parameters, rollback of the
    architectural state, persistence of the cache): the Fig. 1 mistraining schedule, the Fig. 2 victim leak
    with the mix-order reload from a cleared probe array, the speculation-depth boundary (touch trace for any
    cache, observable reload hits from a cleared probe array) and the hidden Write-Execute computation.
    Supporting byte-level x86/x64 models of Figs. 5, 6 and 7 and native
    vectors for the corrected C and MASM sources accompany the selected statement.
  authors: ["Gregory Morse"]
  responsible_maintainers: ["Gregory Morse"]
  license: "MIT"
classification:
  arxiv: ["cs.CR", "cs.LO"]
  msc2020: ["94A60", "68M07", "03D10"]
sources:
  - title: "Self-spectre, write-execute and the hidden state"
    authors: ["Gregory Morse"]
    type: "paper"
    id: "doi:10.2478/tmmp-2019-0010"
    location: "https://doi.org/10.2478/tmmp-2019-0010"
    relationship: "adapts"
    author_endorsement: "participated"
    note: >-
      Tatra Mt. Math. Publ. 73 (2019) 131-144. Two kinds of selected results are formalized. The
      Write-Execute part (Sec. 4) is proved unconditionally about an ideal machine, with exact minimal
      corrections W01-W10 (errata/selfspectre-2019-errata.tex, errata/edits.json) quoted from the
      published PDF and legacy source fixes L01-L05 (errata/minimal.diff). The Self-Spectre part
      (Secs. 2-3: Fig. 1 mistraining, Fig. 2 victim leak, speculation depth, hidden computation) is
      proved only as conditional theorems over an abstract speculation contract, in which the branch
      predictor and the speculation window are parameters and architectural rollback and cache
      persistence are assumptions; the observable leak claims assume a cleared probe array. Not modeled
      and not claimed: any processor's pipeline, branch predictor, cache, timing or handling of
      self-modifying code, whether any CPU satisfies the contract, and the measured Tables 1-2 and Fig. 4
      (native evidence only). The selected leak theorem uses the published PoC's 512-byte probe stride
      and fixed mix-order reload. The current native AES/RSA demos use a 4096-byte stride, calibrated
      timing threshold and shuffled reload order; their measurements are evidence, not an instantiation
      of that exact theorem.
      The original paper remains a separately licensed cited source, not a new mathematical result.
  - title: "Advanced Encryption Standard (AES), FIPS PUB 197"
    authors: ["National Institute of Standards and Technology"]
    type: "other"
    id: "doi:10.6028/NIST.FIPS.197"
    location: "https://doi.org/10.6028/NIST.FIPS.197"
    relationship: "background"
    note: >-
      The AES-128 specification and its Appendix B and C.1 examples. The Lean specification
      is checked against both examples and against the Write-Execute AES procedure.
  - title: "Spectre Attacks: Exploiting Speculative Execution"
    authors: ["Paul Kocher", "Jann Horn", "Anders Fogh", "Daniel Genkin", "Daniel Gruss", "Werner Haas", "Mike Hamburg", "Moritz Lipp", "Stefan Mangard", "Thomas Prescher", "Michael Schwarz", "Yuval Yarom"]
    type: "paper"
    id: "arxiv:1801.01203"
    location: "https://arxiv.org/abs/1801.01203"
    relationship: "background"
    note: >-
      Context for the paper's speculative-execution half. The bounds-check-bypass pattern is stated only
      at the level of the abstract speculation contract; the processor behavior it relies on is not
      modeled.
  - title: "Intel 64 and IA-32 Architectures Software Developer's Manual"
    authors: ["Intel Corporation"]
    type: "other"
    id: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html"
    location: "https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html"
