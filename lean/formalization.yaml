status:
  scope: >-
    The selected Palomar record is PalomarWE.mathematical_result: read-freedom of the ideal machine,
    Turing-completeness with halting, divergence, faults and tape preservation, the finite image,
    confinement of finite fetch sets, the jump-table lookup and 8-bit tables, wide arithmetic,
    division, modular reduction and exponentiation, AES-128 (S-box, Te tables, FIPS-197 equality of
    the Write-Execute procedure, Appendix C.1) and the conditional Self-Spectre results over the abstract speculation contract
    (Mistraining, VictimLeak, WindowDepth, HiddenComputation; observable leak claims from a cleared probe array).
    The machine
    model is ideal: unbounded integer addresses and values, no registers or stack. The paper's
    x86/x64 figures (Fig. 5 NOT/NZ, Fig. 6 XOR copy loop, Fig. 7 carry branch), the NOT table layout and
    the AES-NI sequence of Fig. 3 are proved only in a small byte-level model (X86/ directory) or against the
    given round keys, and the assembled MASM and C are checked by native test vectors and a byte comparison of
    the assembler output with the Lean encodings; all of this is supporting material, not selected registered
    claims. PAPER_MAP.md lists every claim with its status.
    No physical processor, operating-system or cache behavior is formalized: the contract is an assumption,
    not a model of any CPU, and the measured tables are not proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Agent-written Lean proofs, generated exhaustive table checks, a generated Challenge, an errata
        generator and audit, native MSVC/MASM test harnesses, memory-capped local builds, and GitHub
        Actions CI. Lean 4.35.0-rc3 with the pinned Mathlib; direct lean.exe runs under a 1.5 GB cap
        for Mathlib-free modules and cold builds on CI.
      prompting_notes: >-
        Human-directed complete formalization of the author's own paper, with a written plan, nine
        numbered rounds, exact minimal corrections quoted from the published PDF, no sorry or custom
        axiom outside the Challenge theorem hole, and standard axioms only.
    - method: "agent"
      models: ["GPT-6"]
      framework: "OpenAI Codex"
      tool_setup: >-
        Guarded native builds and measurements, cache-timing calibration, portable C changes,
        linked-code alignment diagnostics, documentation and metadata review. The Lean selected
        statements and proofs were not changed in this follow-up.
      prompting_notes: >-
        The author requested restoration of the published Self-Spectre native experiments,
        portability improvements and investigation of rare Write-Execute CI mismatches.
  spend_usd: "subscription-based; exact cost not tracked"
  notes: >-
    Gregory Morse supplied the paper, the original C and MASM sources, the intended claims and the
    project direction. Claude produced the formalization and original validation package; Codex
    produced the follow-up native repairs, diagnostics and documentation. Lean kernel and axiom
    audits and native tests are mechanical evidence, not independent human peer review.
fidelity:
  divergences: >-
    Corrections to the published text are W01-W10: the unbounded-image caveat of the universality claim
    (W01), the instruction-purity wording (W02), the division signature and quotient-overflow behavior
    (W03, W04), the modular exponentiation loop description (W05), Table 2 arithmetic, the subject
    classification, the MOVNTPS width and the Meltdown probe-array size (W06-W09), and the 19-byte NOT
    and NZ table entry 247 (W10). Corrections to the code are L01-L05: Te1-Te3 and Te4 diagnostics, the
    modular exponentiation of one, the mulmod high-half reduction, the NOT/NZ table index bound and the
    modular exponentiation precondition. Each has source excerpts and Lean references in errata/edits.json
    and is validated by validation/audit_errata.py. The machine is ideal and unbounded; finite hardware is
    not claimed to be unbounded. The Self-Spectre results are conditional on an abstract speculation contract
    (predictor and window as parameters, rollback and cache persistence assumed); the PoC's descending training
    loop is followed exactly, and the observable leak claims assume a cleared probe array, as the PoC flushes it.
    The AES-NI key expansion (aeskeygenassist) is not modeled. No further mismatch is
    claimed absent after an unspecified universal review.
review:
  status: "agent-reviewed"
  reviewers: ["Claude Code (automated source and proof audit)"]
  notes: >-
    The agent checked source alignment of the selected definitions, the errata against the published PDF,
    and standard-axiom closure of every WriteExecute declaration. This is not independent human
    mathematical review. The author review of the errata PDF is requested separately. The registered
    version 1 passed the Palomar pipeline at its recorded source commit; any new source commit requires
    its own mechanical verification and review before registration.
acknowledgements: >-
  The Lean and Mathlib contributors for the proof assistant and library, and the smcTuring development
  for the vendored word-level base definitions.
