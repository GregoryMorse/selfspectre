name: Windows intermittent mismatch hunt
# Diagnostic (manual): repeats the deterministic edge vectors on Windows runners, with and without pinning the thread to one
# CPU (WE_PIN=1), to characterise the rare single-result mismatches seen there. A mismatch line also prints a repeat call.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hunt:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        pin: ['0', '1']
        replica: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cmake -S . -B build/cmake -A ${{ matrix.platform }}
      - run: cmake --build build/cmake --config Release --target edge_vectors
      - name: Repeat the edge vectors
        shell: bash
        env:
          WE_PIN: ${{ matrix.pin }}
        run: |
          bad=0
          for i in 1 2 3 4; do
            ./build/cmake/Release/edge_vectors.exe > out.txt || bad=$((bad+1))
            grep -v "edge vectors ok" out.txt || true
          done
          echo "failing runs: $bad of 4 (platform ${{ matrix.platform }}, pin ${{ matrix.pin }})"
          [ "$bad" = 0 ]
