name: Portable native build (CMake)
# Builds the Write-Execute procedures (MASM source), their test harnesses and the Spectre programs with CMake on
# Windows (MSVC x86 and x64), Linux (x86 and x64) and macOS (x64), and runs the harness tests. Evidence for the
# Lean development, not part of it. The Spectre programs are built but never run.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['CMakeLists.txt', 'cmake/**', 'src/**', 'vs/**', 'validation/native/**', '.github/workflows/portable.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/cmake -A ${{ matrix.platform }}
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Test
        # Up to three attempts: see "Intermittent mismatch on Windows runners" in validation/README.md.
        run: ctest --test-dir build/cmake -C Release --output-on-failure --repeat until-pass:3
  msbuild:
    # The Visual Studio solution (vs/selfspectre.sln), built with the pinned Visual Studio 2022 image; output in build/msbuild.
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the solution
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }}
          msbuild vs\selfspectre.sln /nologo /v:m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.arch }}
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make clang gcc g++ gcc-multilib libc6-dev-i386
      - name: Configure
        run: |
          if [ "${{ matrix.arch }}" = x86 ]; then
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS=-m32
          else
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
          fi
      - name: Build
        run: cmake --build build/cmake
      - name: Symbols of the assembled object (diagnostic)
        if: failure()
        run: nm build/cmake/we.o | head -40
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake
      - name: Symbols of the assembled object (diagnostic)
        if: failure()
        run: nm build/cmake/we.o | head -40
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure
