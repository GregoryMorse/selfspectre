name: Portable native build (CMake)
# Builds the Write-Execute procedures (MASM source), their test harnesses and the Spectre programs with CMake on
# Windows (MSVC x86 and x64), Linux (x86 and x64) and macOS (x64), and runs the harness tests. Evidence for the
# Lean development, not part of it. The Spectre programs are built but never run.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['CMakeLists.txt', 'cmake/**', 'src/**', 'vs/**', 'validation/native/**', '.github/workflows/portable.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Environment
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String).Trim()
          (Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, Revision, NumberOfLogicalProcessors | Format-List | Out-String).Trim()
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationVersion
          "Visual Studio $vs"
      - name: Configure
        run: cmake -S . -B build/cmake -A ${{ matrix.platform }}
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Report linked code-patch alignment
        shell: pwsh
        run: |
          $obj = Get-ChildItem build/cmake -Recurse -Filter writeexc.obj | Where-Object { $_.FullName -match 'we_asm' } | Select-Object -First 1
          $map = Get-ChildItem build/cmake -Recurse -Filter edge_vectors.map | Select-Object -First 1
          if ($obj -and $map) { python validation/patch_alignment.py $obj.FullName $map.FullName }
          else { throw "Write-Execute object or edge_vectors linker map is missing" }
      - name: Test
        # Up to three attempts: see "Intermittent mismatch on Windows runners" in validation/README.md.
        run: ctest --test-dir build/cmake -C Release --output-on-failure -V --repeat until-pass:3
      - name: Keep test logs and binaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-windows-${{ matrix.platform }}
          path: |
            build/cmake/Testing
            build/cmake/edge_vectors*
            build/cmake/writeexec*
            build/cmake/Release/*.exe
            build/cmake/Release/*.pdb
            build/cmake/Release/*.map
          if-no-files-found: ignore
  msbuild:
    # The Visual Studio solution (vs/selfspectre.sln), built with the pinned Visual Studio 2022 image; output in build/msbuild.
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the solution
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }}
          msbuild vs\selfspectre.sln /nologo /v:m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.arch }}
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make clang gcc g++ gcc-multilib libc6-dev-i386
      - name: Environment
        run: |
          uname -a
          cmake --version | head -1
          ${CC:-cc} --version | head -1
          if [ "$(uname)" = Darwin ]; then sysctl -n machdep.cpu.brand_string; sw_vers; else grep -m1 "model name" /proc/cpuinfo; grep -m1 microcode /proc/cpuinfo || true; fi
      - name: Restore assembled objects
        id: asm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/cmake/we.o
            build/cmake/rsa.o
          key: asm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src/writeexc.asm', 'src/spectrecode.asm', 'cmake/UASM.cmake', 'cmake/UasmPatch.cmake', 'cmake/elf2blob.py') }}
      - name: Configure
        run: |
          if [ "${{ matrix.arch }}" = x86 ]; then
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS=-m32
          else
            cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
          fi
      - name: Mark restored objects as up to date
        if: steps.asm-cache.outputs.cache-hit == 'true'
        run: touch build/cmake/we.o build/cmake/rsa.o 2>/dev/null || touch build/cmake/we.o
      - name: Build
        run: cmake --build build/cmake
      - name: Save assembled objects
        if: steps.asm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/cmake/we.o
            build/cmake/rsa.o
          key: ${{ steps.asm-cache.outputs.cache-primary-key }}
      - name: Symbols of the assembled object (diagnostic)
        if: failure()
        run: nm build/cmake/we.o | head -40
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure -V
      - name: Keep test logs and binaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-linux-${{ matrix.arch }}
          path: |
            build/cmake/Testing
            build/cmake/edge_vectors*
            build/cmake/writeexec*
            build/cmake/Release/*.exe
            build/cmake/Release/*.pdb
          if-no-files-found: ignore
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Environment
        run: |
          uname -a
          cmake --version | head -1
          ${CC:-cc} --version | head -1
          if [ "$(uname)" = Darwin ]; then sysctl -n machdep.cpu.brand_string; sw_vers; else grep -m1 "model name" /proc/cpuinfo; grep -m1 microcode /proc/cpuinfo || true; fi
      - name: Restore assembled objects
        id: asm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/cmake/we.o
            build/cmake/rsa.o
          key: asm-${{ runner.os }}-x64-${{ hashFiles('src/writeexc.asm', 'src/spectrecode.asm', 'cmake/UASM.cmake', 'cmake/UasmPatch.cmake', 'cmake/elf2blob.py') }}
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - name: Mark restored objects as up to date
        if: steps.asm-cache.outputs.cache-hit == 'true'
        run: touch build/cmake/we.o build/cmake/rsa.o 2>/dev/null || touch build/cmake/we.o
      - name: Build
        run: cmake --build build/cmake
      - name: Save assembled objects
        if: steps.asm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/cmake/we.o
            build/cmake/rsa.o
          key: ${{ steps.asm-cache.outputs.cache-primary-key }}
      - name: Symbols of the assembled object (diagnostic)
        if: failure()
        run: nm build/cmake/we.o | head -40
      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure -V
      - name: Keep test logs and binaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-macos
          path: |
            build/cmake/Testing
            build/cmake/edge_vectors*
            build/cmake/writeexec*
            build/cmake/Release/*.exe
            build/cmake/Release/*.pdb
          if-no-files-found: ignore
